name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          check-latest: true

      - name: Vet & test
        run: |
          go vet ./...
          go test ./...

      - name: Cross-compile (linux amd64 + arm64)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/naivepanel-release"
          for arch in amd64 arm64; do
            mkdir -p "${RUNNER_TEMP}/naivepanel-${arch}"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "${RUNNER_TEMP}/naivepanel-${arch}/naivepanel" ./cmd/naivepanel
            tar -czf "${RUNNER_TEMP}/naivepanel-release/naivepanel-linux-${arch}.tar.gz" \
              -C "${RUNNER_TEMP}/naivepanel-${arch}" naivepanel
          done
          test "$("${RUNNER_TEMP}/naivepanel-amd64/naivepanel" version)" = "naivepanel ${GITHUB_REF_NAME}"
          test -z "$(git status --porcelain)"
          cd "${RUNNER_TEMP}/naivepanel-release"
          sha256sum naivepanel-linux-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/naivepanel-release/naivepanel-linux-amd64.tar.gz
            ${{ runner.temp }}/naivepanel-release/naivepanel-linux-arm64.tar.gz
            ${{ runner.temp }}/naivepanel-release/SHA256SUMS
          generate_release_notes: true
