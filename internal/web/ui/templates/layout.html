{{define "layout.html"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · NaivePanel</title>
<link rel="stylesheet" href="{{.Base}}/static/style.css">
</head>
<body>
<div class="shell">
<aside class="sidebar">
  <a class="brand" href="{{.Base}}/"><i data-lucide="server"></i><span>NaivePanel</span></a>
  <nav>
    <a href="{{.Base}}/" class="{{if eq .Title "仪表盘"}}active{{end}}"><i data-lucide="gauge"></i><span>仪表盘</span></a>
    <a href="{{.Base}}/sites" class="{{if eq .Title "站点管理"}}active{{end}}"><i data-lucide="globe"></i><span>站点</span></a>
    <a href="{{.Base}}/caddy/preview" class="{{if eq .Title "Caddy 配置预览"}}active{{end}}"><i data-lucide="file-cog"></i><span>Caddy 配置</span></a>
    <a href="{{.Base}}/bypasscore" class="{{if eq .Title "BypassCore"}}active{{end}}"><i data-lucide="route"></i><span>BypassCore</span></a>
    <a href="{{.Base}}/geo" class="{{if eq .Title "Geo 数据文件"}}active{{end}}"><i data-lucide="map"></i><span>Geo 数据</span></a>
    <a href="{{.Base}}/settings" class="{{if eq .Title "设置"}}active{{end}}"><i data-lucide="settings"></i><span>设置</span></a>
  </nav>
  <form method="post" action="{{.Base}}/logout" class="logout">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <button type="submit"><i data-lucide="log-out"></i><span>退出</span></button>
  </form>
</aside>
<main>
{{if .Flash}}<div class="flash">{{.Flash}}</div>{{end}}
{{template "content" .}}
</main>
</div>
<script src="{{.Base}}/static/lucide.min.js"></script>
<script src="{{.Base}}/static/app.js"></script>
</body>
</html>{{end}}
