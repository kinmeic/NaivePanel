{{define "content"}}
<h1>Geo 数据文件</h1>
<p class="muted">来源：Loyalsoldier/v2ray-rules-dat，保存至 <code>{{.Data.Dir}}</code>（与 BypassCore 同目录）。下载后自动校验 sha256 并原子替换，随后触发 BypassCore 热重载。</p>
<table>
  <thead><tr><th>文件</th><th>状态</th><th>大小</th><th>更新时间</th></tr></thead>
  <tbody>
  {{range .Data.Files}}
  <tr>
    <td class="mono">{{.Name}}</td>
    <td>{{if .Exists}}<span class="ok">存在</span>{{else}}<span class="warn">缺失</span>{{end}}</td>
    <td>{{if .Exists}}{{.Size}} 字节{{else}}-{{end}}</td>
    <td>{{fmtTime .ModTime}}</td>
  </tr>
  {{end}}
  </tbody>
</table>
<form method="post" action="{{.Base}}/geo/update" class="inline-block" data-confirm="现在下载并更新 Geo 数据文件？">
  <input type="hidden" name="_csrf" value="{{.CSRF}}">
  <button type="submit" class="primary">{{icon "download"}}立即更新</button>
</form>
{{end}}
