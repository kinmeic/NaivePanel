{{define "content"}}
<h1>Caddy</h1>
<div class="cards">
  <div class="card">
    <h3>{{icon "power"}}服务控制</h3>
    <div class="service-status-line">
      <span class="service-status-item">服务：{{if .Data.Active}}<span class="ok">运行中</span>{{else}}<span class="warn">未运行</span>{{end}}</span>
      <span class="service-status-item">开机自启：{{if .Data.Enabled}}<span class="ok">已开启</span>{{else}}<span class="muted">已关闭</span>{{end}}</span>
    </div>
    <div class="service-actions">
      <form method="post" action="{{.Base}}/caddy/service">
        <input type="hidden" name="_csrf" value="{{.CSRF}}">
        <button name="action" value="start" class="btn">{{icon "play"}}启动</button>
        <button name="action" value="stop" class="btn" data-confirm="停止 Caddy 后面板将随站点一起不可访问，需要到服务器上手动启动，确定停止？">{{icon "square"}}停止</button>
        <button name="action" value="restart" class="btn" data-confirm="重启期间面板与站点会短暂断连，确定重启 Caddy？">{{icon "rotate-cw"}}重启</button>
      </form>
      <form method="post" action="{{.Base}}/caddy/service">
        <input type="hidden" name="_csrf" value="{{.CSRF}}">
        {{if .Data.Enabled}}
        <button name="action" value="disable" class="btn" data-confirm="关闭后 Caddy 将不会随系统启动；当前服务不会停止。确定关闭？">{{icon "x"}}关闭自启</button>
        {{else}}
        <button name="action" value="enable" class="btn">{{icon "check"}}开启自启</button>
        {{end}}
      </form>
      <a class="btn" href="{{.Base}}/caddy/config">{{icon "pencil"}}编辑配置</a>
      <form method="post" action="{{.Base}}/caddy/reload">
        <input type="hidden" name="_csrf" value="{{.CSRF}}">
        <button type="submit" class="btn" data-confirm="确定要用已保存的 Caddyfile 重载 Caddy？">{{icon "refresh-cw"}}重载配置</button>
      </form>
      <a class="btn" href="{{.Base}}/logs?service=caddy">{{icon "scroll-text"}}查看日志</a>
    </div>
  </div>
</div>
{{end}}
