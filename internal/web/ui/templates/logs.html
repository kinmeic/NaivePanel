{{define "content"}}
<h1>日志</h1>
<p class="muted">面板内已认证操作的审计记录；不记录密码、令牌、配置正文或其他表单内容（最新在最后）。</p>
<div class="logbar">
  <span class="muted">行数：</span>
  <a class="btn {{if eq .Data.Lines 100}}active{{end}}" href="{{.Base}}/logs?lines=100">100</a>
  <a class="btn {{if eq .Data.Lines 200}}active{{end}}" href="{{.Base}}/logs?lines=200">200</a>
  <a class="btn {{if eq .Data.Lines 500}}active{{end}}" href="{{.Base}}/logs?lines=500">500</a>
  <a class="btn {{if eq .Data.Lines 1000}}active{{end}}" href="{{.Base}}/logs?lines=1000">1000</a>
  <a class="btn" href="{{.Base}}/logs?lines={{.Data.Lines}}">{{icon "refresh-cw"}}刷新</a>
</div>
{{if .Data.Error}}<div class="error">{{.Data.Error}}</div>{{end}}
{{if .Data.Content}}<pre class="preview logs">{{.Data.Content}}</pre>{{end}}
{{end}}
