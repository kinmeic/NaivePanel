{{define "content"}}
<div class="editor-title"><a class="btn icon-btn" href="{{.Base}}/agentcore" title="返回 AgentCore" aria-label="返回 AgentCore">{{icon "arrow-left"}}</a><div><h1>AgentCore 日志</h1></div></div>
<div class="logbar">
  <span class="muted">条数：</span>
  <a class="btn {{if eq .Data.LogLines 100}}active{{end}}" href="{{.Base}}/agentcore/logs?lines=100">100</a>
  <a class="btn {{if eq .Data.LogLines 200}}active{{end}}" href="{{.Base}}/agentcore/logs?lines=200">200</a>
  <a class="btn {{if eq .Data.LogLines 500}}active{{end}}" href="{{.Base}}/agentcore/logs?lines=500">500</a>
  <a class="btn {{if eq .Data.LogLines 1000}}active{{end}}" href="{{.Base}}/agentcore/logs?lines=1000">1000</a>
  <a class="btn" href="{{.Base}}/agentcore/logs?lines={{.Data.LogLines}}">{{icon "refresh-cw"}}刷新</a>
</div>
<div class="card">
  {{if .Data.LogError}}<p class="warning">{{.Data.LogError}}</p>{{end}}
  <pre class="logs">{{.Data.LogContent}}</pre>
</div>
{{end}}
